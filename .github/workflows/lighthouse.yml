name: lighthouse
on:
  push:
    branches: [main]
  pull_request:
jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Run preview server
        run: |
          nohup npm run preview -- --host 127.0.0.1 --port 4321 > /tmp/preview.log 2>&1 &
          sleep 8
          curl --max-time 10 -I http://127.0.0.1:4321/porto-BT/ || (cat /tmp/preview.log; exit 1)
      - uses: treosh/lighthouse-ci-action@v11
        with:
          urls: |
            http://127.0.0.1:4321/porto-BT/
          uploadArtifacts: true
          temporaryPublicStorage: true
          runs: 1
